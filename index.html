<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZNNB.com · 100种小游戏导航</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%2305060a'/><text x='50' y='68' font-size='56' text-anchor='middle' fill='%2300e5ff' font-family='monospace' font-weight='bold'>A</text></svg>">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Orbitron:wght@600;800;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root{
    --bg:#05060a; --bg2:#0a0e16; --panel:#0c1019; --panel2:#101624;
    --cyan:#00e5ff; --magenta:#ff2ed1; --violet:#8a5cff; --lime:#c7ff3b;
    --text:#e8eef2; --dim:#8a96a6;
    --line:rgba(0,229,255,.16); --line2:rgba(138,92,255,.22);
    --glow-cyan:0 0 18px rgba(0,229,255,.35); --glow-mag:0 0 18px rgba(255,46,209,.3);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.6; overflow-x:hidden; -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--cyan);color:#000}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

  /* ===== 全屏赛博背景 ===== */
  .grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .grid-bg::before{content:"";position:absolute;inset:0;
    background-image:linear-gradient(rgba(0,229,255,.05) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(138,92,255,.05) 1px,transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(ellipse 80% 60% at 50% 20%, #000 20%, transparent 80%);
    -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 20%, #000 20%, transparent 80%);}
  .grid-bg::after{content:"";position:absolute;left:50%;bottom:-40%;width:140%;height:70%;
    transform:translateX(-50%);
    background-image:linear-gradient(rgba(0,229,255,.12) 1.5px,transparent 1.5px),
                     linear-gradient(90deg,rgba(255,46,209,.12) 1.5px,transparent 1.5px);
    background-size:56px 56px;
    transform-origin:50% 100%; transform:translateX(-50%) perspective(400px) rotateX(58deg);
    mask-image:linear-gradient(transparent,#000 60%);
    -webkit-mask-image:linear-gradient(transparent,#000 60%);}
  .scanlines{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.35;
    background:repeating-linear-gradient(0deg,transparent 0 2px, rgba(255,255,255,.02) 2px 3px);}

  /* ===== 进场过渡 ===== */
  #intro{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
    background:var(--bg);transition:opacity .9s ease,visibility .9s ease;}
  #intro.done{opacity:0;visibility:hidden}
  #intro .intro-block{text-align:center;opacity:0;animation:moveUp .8s cubic-bezier(.2,.8,.2,1) 1.05s forwards}
  @keyframes moveUp{from{opacity:0;transform:translateY(0)}to{opacity:1;transform:translateY(-56px)}}
  #intro .intro-title{
    font-family:"Orbitron",monospace;font-weight:900;letter-spacing:.04em;line-height:1;
    font-size:clamp(2.6rem,9vw,5.6rem);white-space:nowrap;
    background:linear-gradient(90deg,#00e5ff 0%,#8a5cff 55%,#ff2ed1 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    text-shadow:0 0 40px rgba(0,229,255,.25);
    transform:translateX(-110%);opacity:0;
    animation:introSlide 1.1s cubic-bezier(.16,.84,.24,1) .05s forwards;
  }
  @keyframes introSlide{from{transform:translateX(-110%);opacity:0}to{transform:translateX(0);opacity:1}}
  #intro .intro-sub{
    margin-top:18px;color:var(--dim);font-size:clamp(.9rem,2.4vw,1.1rem);letter-spacing:.22em;
    opacity:0;animation:subPop .7s cubic-bezier(.2,.8,.2,1) 1.5s forwards;
  }
  @keyframes subPop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  #intro .corner{position:absolute;font-family:"JetBrains Mono",monospace;color:var(--cyan);
    font-size:.72rem;letter-spacing:.2em;opacity:.6}
  #intro .corner.tl{top:22px;left:24px}
  #intro .corner.tr{top:22px;right:24px}
  #intro .corner.bl{bottom:22px;left:24px}
  #intro .corner.br{bottom:22px;right:24px}

  /* ===== 主站 ===== */
  .site{position:relative;z-index:2}

  /* 顶栏 */
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    padding:16px 26px;background:rgba(5,6,10,.72);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .brand{font-family:"Orbitron",monospace;font-weight:800;font-size:1.25rem;letter-spacing:.06em;
    background:linear-gradient(90deg,var(--cyan),var(--violet));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .topbar .count{font-family:"JetBrains Mono",monospace;color:var(--dim);font-size:.78rem;letter-spacing:.12em}
  .topbar .count b{color:var(--cyan)}

  /* Hero 站标 */
  .hero{min-height:52vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 20px 70px;position:relative}
  .hero .big{font-family:"Orbitron",monospace;font-weight:900;font-size:clamp(2.4rem,10vw,5rem);
    letter-spacing:.06em;line-height:1.05;
    background:linear-gradient(90deg,#e8eef2 0%,var(--cyan) 50%,var(--magenta) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 24px rgba(0,229,255,.2))}
  .hero .big em{font-style:normal;-webkit-text-fill-color:var(--cyan)}
  .hero .tag{font-family:"JetBrains Mono",monospace;color:var(--dim);margin-top:16px;letter-spacing:.28em;font-size:.85rem}
  .hero .tag b{color:var(--magenta)}

  /* 区块通用 */
  .sec{padding:16px 0 70px}
  .sec-inner{max-width:1080px;margin:0 auto;padding:0 20px}
  .sec-head{display:flex;align-items:center;gap:16px;margin-bottom:34px}
  .sec-head .mark{width:46px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--cyan),var(--magenta));box-shadow:var(--glow-cyan)}
  .sec-head h2{font-family:"Orbitron",monospace;font-size:1.7rem;letter-spacing:.12em}
  .sec-head .en{font-family:"JetBrains Mono",monospace;color:var(--dim);font-size:.78rem;letter-spacing:.24em}

  /* 精选 */
  .featured{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  @media(max-width:760px){.featured{grid-template-columns:1fr}}
  .fcard{
    position:relative;border:1px solid var(--line);border-radius:16px;padding:26px;overflow:hidden;
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    cursor:pointer;transition:transform .28s cubic-bezier(.2,.8,.2,1),border-color .28s ease,box-shadow .28s ease;
    display:flex;flex-direction:column;gap:10px;
  }
  .fcard::before{content:"";position:absolute;inset:0;opacity:0;transition:opacity .3s;
    background:linear-gradient(135deg,rgba(0,229,255,.10),transparent 50%,rgba(255,46,209,.10))}
  .fcard:hover{transform:translateY(-6px);border-color:var(--cyan);box-shadow:0 18px 40px rgba(0,0,0,.4),0 0 24px rgba(0,229,255,.12)}
  .fcard:hover::before{opacity:1}
  .fcard .fname{font-size:1.25rem;font-weight:700;position:relative}
  .fcard .furl{font-family:"JetBrains Mono",monospace;color:var(--dim);font-size:.8rem;position:relative;
    display:flex;align-items:center;gap:6px}
  .fcard .furl::after{content:"→";color:var(--cyan)}
  .fcard .frank{position:absolute;top:14px;right:18px;font-family:"Orbitron",monospace;
    font-size:1rem;color:var(--line2);font-weight:800;letter-spacing:.05em}
  .fcard:nth-child(1){--c:var(--magenta)} .fcard:nth-child(1) .frank{color:rgba(255,46,209,.5)}
  .fcard:nth-child(2){--c:var(--cyan)} .fcard:nth-child(2) .frank{color:rgba(0,229,255,.5)}
  .fcard:nth-child(3){--c:var(--violet)} .fcard:nth-child(3) .frank{color:rgba(138,92,255,.55)}
  .fcard:nth-child(1):hover{border-color:var(--magenta);box-shadow:0 18px 40px rgba(0,0,0,.4),0 0 24px rgba(255,46,209,.15)}

  /* 分区切换 */
  .tabs{display:flex;gap:12px;margin:6px 0 30px}
  .tab{flex:1;padding:16px;border:1px solid var(--line);border-radius:14px;text-align:center;
    background:var(--panel);font-size:1.05rem;font-weight:700;cursor:pointer;color:var(--dim);
    transition:color .25s,border-color .25s,background .25s,box-shadow .25s;position:relative;overflow:hidden}
  .tab .en{display:block;font-family:"JetBrains Mono",monospace;font-size:.68rem;letter-spacing:.3em;margin-top:4px;opacity:.7}
  .tab.active{color:#000;border-color:transparent;background:linear-gradient(135deg,var(--cyan),var(--violet));box-shadow:var(--glow-cyan)}
  .tab:not(.active):hover{color:var(--cyan);border-color:var(--line2)}

  /* 游戏列表 */
  .list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .list-head .lname{font-family:"Orbitron",monospace;font-size:1.2rem;letter-spacing:.1em;color:var(--cyan)}
  .list-head .lnum{font-family:"JetBrains Mono",monospace;color:var(--dim);font-size:.8rem}
  .list-head .lnum b{color:var(--magenta)}
  .game-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media(max-width:1080px){.game-grid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:820px){.game-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:520px){.game-grid{grid-template-columns:1fr}}
  .game-grid.enter{animation:gridEnter .55s cubic-bezier(.2,.8,.2,1) both}
  @keyframes gridEnter{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
  .gcard{
    display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;
    border:1px solid var(--line);border-radius:12px;background:var(--panel);
    transition:border-color .2s ease,background .2s ease,transform .2s ease;cursor:pointer;
  }
  .gcard:hover{transform:translateY(-3px);border-c
